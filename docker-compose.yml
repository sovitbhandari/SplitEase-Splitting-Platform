services:
  db:
    image: postgres:15-alpine
    container_name: splitease-db
    environment:
      POSTGRES_USER: splitease
      POSTGRES_PASSWORD: password
      POSTGRES_DB: splitease_dev
    ports:
      # Use 5433 on the host if another Postgres already binds 5432 locally.
      - "5433:5432"
    volumes:
      - splitease_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitease -d splitease_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: splitease-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  splitease_data:
  redis_data:
