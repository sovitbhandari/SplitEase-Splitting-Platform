name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: splitease
          POSTGRES_PASSWORD: password
          POSTGRES_DB: splitease_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitease -d splitease_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://splitease:password@localhost:5432/splitease_ci
      JWT_SECRET: ci-local-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-local-refresh-secret-at-least-32-characters
      ENCRYPTION_KEY: ci-local-encryption-key
      CLIENT_ORIGIN: http://localhost:3000
      PLAID_ENV: sandbox
      ENABLE_PLAID_TRANSFER_SANDBOX: "false"
      ENABLE_REAL_MONEY_MOVEMENT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Server typecheck
        run: npm run typecheck --workspace server

      - name: Server tests
        run: npm test --workspace server

      - name: Client build
        run: npm run build --workspace client

      - name: Allocation evidence harness
        run: npm run bench:splitease:allocation

      - name: Whitespace check
        run: git diff --check
